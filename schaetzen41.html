<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schätzspiel: в среднем</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f4f9; color: #2c3e50; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .values-box { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .slider-container { margin: 25px 0; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #3498db; }
        .feedback { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 30px; }
        .correct { color: #27ae60; }
        .close { color: #f39c12; }
        .incorrect { color: #e74c3c; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 5px; font-size: 16px; }
        button:hover { background: #34495e; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Schätzspiel: Finde den Durchschnitt</h2>
        <p>In drei Geschäften kostet die Milch unterschiedlich viel:</p>
        
        <div class="values-box">
            Laden 1: 70 Rubel | Laden 2: 85 Rubel | Laden 3: 90 Rubel
        </div>

        <p>Bewege den Regler auf den geschätzten Durchschnittswert <strong>в среднем</strong>:</p>

        <div class="slider-container">
            <input type="range" id="rangeSlider" min="60" max="100" value="60" oninput="checkSlider()">
            <p>Dein Wert: <span id="sliderValue">60</span> Rubel</p>
        </div>

        <div class="feedback" id="feedbackMsg">Bewege den Regler...</div>

        <button onclick="location.reload()">Neustart</button>
    </div>

    <script>
        const correctAverage = 82; // Mathematischer Durchschnitt (70+85+90)/3 = 81.67 (~82)
        
        function checkSlider() {
            const val = parseInt(document.getElementById('rangeSlider').value);
            document.getElementById('sliderValue').innerText = val;
            const msg = document.getElementById('feedbackMsg');

            const diff = Math.abs(val - correctAverage);

            if (diff <= 3) {
                msg.innerText = "Perfekt! Das ist в среднем (im Durchschnitt) genau richtig!";
                msg.className = "feedback correct";
            } else if (diff <= 8) {
                msg.innerText = "Schon sehr nah dran! Probier es noch etwas genauer.";
                msg.className = "feedback close";
            } else {
                msg.innerText = "Noch nicht ganz. Versuche den Mittelwert zu treffen.";
                msg.className = "feedback incorrect";
            }
        }
    </script>
</body>
</html>
